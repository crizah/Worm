services:
  postgres:
    image: postgres:16-alpine
    container_name: worm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: worm_dev
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worm_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
